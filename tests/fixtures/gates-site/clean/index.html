<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harbour Bakery: sourdough baked at dawn</title>
<meta name="description" content="A neighbourhood bakery baking sourdough, rye and seeded loaves every morning from 5am.">
<style>
  body { margin: 0; background: #fbfaf7; color: #1d1b18; font: 18px/1.6 system-ui, sans-serif; }
  .skip { position: absolute; left: -9999px; top: 0; padding: 12px 16px; background: #1d1b18; color: #fff; }
  .skip:focus { left: 0; }
  header, main, footer { max-width: 60rem; margin: 0 auto; padding: 0 1rem; }
  nav a { display: inline-block; min-height: 44px; padding: 10px 12px; color: #1d1b18; }
  h1 { font-size: clamp(2.2rem, 1rem + 5vw, 4.75rem); line-height: 1.05; margin: 2rem 0 1rem; }
  h2 { font-size: 1.5rem; margin: 0 0 .5rem; }
  section { padding: 2.5rem 0; }
  section + section { padding-top: 4.5rem; }
  .cta { display: inline-block; min-height: 44px; padding: 10px 20px; background: #1d1b18; color: #fff; text-decoration: none; }
  label { display: block; }
  input { min-height: 44px; font: inherit; width: 100%; max-width: 22rem; box-sizing: border-box; }
  img { max-width: 100%; height: auto; display: block; }
  a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid #0b57d0; outline-offset: 2px; }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header>
  <nav aria-label="Primary">
    <a href="index.html">Home</a>
    <a href="about.html">Our ovens</a>
  </nav>
</header>
<main id="main">
  <section>
    <h1>Sourdough, baked before you wake</h1>
    <p>Every loaf proves for twenty hours and bakes at five in the morning, six days a week.</p>
    <a class="cta" href="about.html">See how we bake</a>
  </section>
  <section>
    <h2>Order a loaf</h2>
    <img src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='320' height='120'%3E%3Crect width='320' height='120' fill='%23d9c9a8'/%3E%3C/svg%3E" width="320" height="120" alt="A tray of freshly baked sourdough loaves">
    <form action="about.html" method="get">
      <label for="name">Your name</label>
      <input id="name" name="name" type="text" autocomplete="name">
      <button class="cta" type="submit">Reserve</button>
    </form>
  </section>
  <section>
    <h2>Opening hours</h2>
    <p>Tuesday to Sunday, 6am until the bread runs out.</p>
  </section>
</main>
<footer><p>Harbour Bakery, 4 Quay Street.</p></footer>

</html>
