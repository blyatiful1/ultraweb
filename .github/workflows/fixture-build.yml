# fixture-build — proves the scaffold recipe against the LIVE ecosystem.
# scripts/scaffold-fixture.sh is the single executable core of skills/scaffold
# (Phase 5): this workflow runs that exact script weekly and whenever the recipe,
# the skill, or the stack manifest changes, so ecosystem drift that would break a
# real build turns a badge red here first, not in a client session. The drift
# report is informational; the script is the gate.
name: fixture-build
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'
  push:
    paths:
      - 'stack/versions.json'
      - 'scripts/scaffold-fixture.sh'
      - 'scripts/verify-stack.mjs'
      - 'skills/scaffold/**'
      - '.github/workflows/fixture-build.yml'

jobs:
  scaffold-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stack drift report (informational)
        run: node scripts/verify-stack.mjs
        continue-on-error: true
      - name: Run the scaffold recipe (the same file skills/scaffold cites)
        run: bash scripts/scaffold-fixture.sh fixture
