# fixture-build — keeps stack/versions.json true and buildable.
# Two gates, both blocking:
#   1. verify-stack: any pin that differs from the live npm registry fails the job. A weekly red
#      run is the signal to run `node scripts/verify-stack.mjs --write`, re-verify the STACK.md API
#      facts for any major, and commit the new manifest.
#   2. scaffold-fixture: installs exactly the pinned versions, builds, type-checks and serves a
#      fresh Next project, then checks every resolved version equals its pin.
name: fixture-build
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'
  push:
    paths:
      - 'stack/versions.json'
      - 'STACK.md'
      - 'references/scaffold.md'
      - 'scripts/scaffold-fixture.sh'
      - 'scripts/verify-stack.mjs'
      - '.github/workflows/fixture-build.yml'

jobs:
  scaffold-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pins match the live registry (drift fails the job)
        run: node scripts/verify-stack.mjs
      - name: Scaffold, build and serve the pinned stack
        run: bash scripts/scaffold-fixture.sh fixture
