name: corpus-ci
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Corpus invariants (four skills, paths, sizes, no stale skill tokens, no version pins)
        run: node scripts/lint-corpus.mjs
      - name: Shellcheck every shell file
        run: |
          files=$(git ls-files '*.sh')
          if [ -n "$files" ]; then shellcheck --severity=warning $files; fi

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright + axe-core so the measurement-library test runs live
        run: npm install --no-save --no-package-lock playwright axe-core && npx playwright install --with-deps chromium
      - name: Unit tests (lint-corpus, manifests, site-check, measurement library, scripts)
        run: node --test tests/*.test.mjs
      - name: Hook fixture tests (antislop, gate-stop)
        run: for t in tests/hook-*.test.sh; do bash "$t" || exit 1; done
