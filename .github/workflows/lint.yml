name: corpus-ci
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint the skill corpus invariants
        run: node scripts/lint-skills.mjs
      - name: Context budget (what the Lead loads per phase stays under the ceiling)
        run: node scripts/context-budget.mjs

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright + axe-core so the measurement-library test runs live (it refuses to skip under CI)
        run: npm install --no-save --no-package-lock playwright axe-core && npx playwright install --with-deps chromium
      - name: Linter self-test + manifest/hook-wiring + policy + site-check + measurement-library tests
        run: node --test tests/*.test.mjs
      - name: Hook fixture tests (antislop blocking behavior, studio-log JSONL)
        run: bash tests/hook-antislop.test.sh
      - name: Hook fixture tests (shell-write-guard blocks shell writes inside a build)
        run: bash tests/hook-shell-write-guard.test.sh
      - name: Shellcheck the hooks and recipe scripts (error severity)
        run: shellcheck --severity=error hooks/*.sh scripts/*.sh
